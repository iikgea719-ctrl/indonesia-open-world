
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indonesia Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#top{
 position:fixed;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;align-items:center;
 pointer-events:none;z-index:5
}
.logo{
 background:#101820d9;padding:10px 13px;border-radius:10px;
 border:1px solid #ffffff30;font-size:13px;font-weight:bold;
 letter-spacing:1px
}
#status{
 background:#101820d9;padding:10px 13px;border-radius:10px;
 border:1px solid #ffffff30;font-size:12px
}
#message{
 position:fixed;top:75px;left:50%;transform:translateX(-50%);
 background:#101820dd;padding:9px 14px;border-radius:8px;
 font-size:12px;white-space:nowrap;z-index:5
}
#controls{
 position:fixed;bottom:18px;left:0;right:0;
 display:flex;justify-content:space-between;align-items:end;
 padding:0 18px;z-index:10;pointer-events:none
}
.group{display:flex;gap:9px;align-items:end;pointer-events:auto}
button{
 border:1px solid #ffffff55;color:white;
 background:#172630dd;border-radius:14px;
 width:58px;height:58px;font-size:20px;font-weight:bold;
 box-shadow:0 4px 12px #0008;touch-action:none
}
button:active{background:#31845c;transform:scale(.94)}
#enter{
 width:auto;height:48px;padding:0 16px;font-size:13px;
 background:#167b52;font-weight:bold
}
#gas,#brake{height:68px;width:64px}
#gas{background:#167b52dd}
#brake{background:#a63838dd}
#hint{
 position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
 color:#ffffffb8;font-size:11px;white-space:nowrap;z-index:5;
 background:#10182099;padding:7px 10px;border-radius:7px
}
@media(min-width:800px){
 #controls{padding:0 35px 20px}
 button{width:65px;height:65px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
 <div class="logo">INDONESIA <span style="color:#62e6a0">OPEN WORLD</span></div>
 <div id="status">MODE: BERJALAN</div>
</div>
<div id="message">Selamat datang di Jakarta</div>
<div id="hint">Gunakan tombol untuk bergerak dan menjelajahi kota</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="enter">MASUK MOBIL</button>
  <button id="brake">REM</button>
  <button id="gas">GAS</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc5df);
scene.fog = new THREE.Fog(0x9bc5df, 100, 430);

const camera = new THREE.PerspectiveCamera(
 65, window.innerWidth/window.innerHeight, 0.1, 700
);
camera.position.set(0,8,15);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('game').appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xd8ecff,0x59604a,2.0));

const sun = new THREE.DirectionalLight(0xffe5bd,3.0);
sun.position.set(-70,110,55);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

// MATERIALS
const mat = (color,roughness=0.8,metalness=0)=>{
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
};
const grassMat=mat(0x647d52);
const roadMat=mat(0x30363b,0.95);
const sidewalkMat=mat(0xaaa9a0);
const whiteMat=mat(0xe8e6d9);
const darkMat=mat(0x15191c,0.55);
const glassMat=new THREE.MeshStandardMaterial({
 color:0x294b5d,metalness:0.45,roughness:0.22,
 transparent:true,opacity:0.83
});

// GROUND
function box(parent,w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}
box(scene,700,0.5,700,grassMat,0,-0.35,0);

// ROADS
box(scene,16,0.12,600,roadMat,0,0,0);
box(scene,600,0.12,16,roadMat,0,0,0);

// Sidewalks
for(const side of [-1,1]){
 box(scene,3,0.22,600,sidewalkMat,side*9.5,0.05,0);
 box(scene,600,0.22,3,sidewalkMat,0,0.05,side*9.5);
}

// Road markings
for(let z=-290;z<300;z+=12){
 box(scene,0.18,0.025,5,whiteMat,0,0.075,z);
}
for(let x=-290;x<300;x+=12){
 box(scene,5,0.025,0.18,whiteMat,x,0.075,0);
}

// BUILDINGS
const buildingColors=[
 0xaaa99f,0xb8b3a7,0x7d929a,0xc2b7a3,
 0x777f83,0xd0c9b9,0x8b9b9d,0x9d927e
];
function building(x,z,w,d,h,index){
 const color=buildingColors[index%buildingColors.length];
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const bodyMat=mat(color,0.85);
 box(group,w,h,d,bodyMat,0,h/2,0);

 // Window strips
 const rows=Math.max(2,Math.floor(h/3));
 const cols=Math.max(2,Math.floor(w/2.5));
 const windowMat=new THREE.MeshStandardMaterial({
  color:0x35505b,roughness:0.28,metalness:0.25
 });
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const wx=-w/2+1+(c*(w-2)/cols);
   const wy=2+r*(h-2)/rows;
   if(w>3 && h>5){
    box(group,Math.min(1.25,w/cols*.55),1.05,0.07,
     windowMat,wx,wy,d/2+0.04);
    box(group,0.07,1.05,Math.min(1.25,d/cols*.55),
     windowMat,w/2+0.04,wy,-d/2+1+c*(d-2)/cols);
   }
  }
 }
 // Rooftop detail
 if(h>22){
  box(group,w*.3,1.5,d*.3,mat(0x777b7c),0,h+0.75,0);
 }
}

// Create city blocks
let seed=21;
function random(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}
let buildingIndex=0;
for(let x=-95;x<=95;x+=25){
 for(let z=-95;z<=95;z+=25){
  if(Math.abs(x)<17 || Math.abs(z)<17)continue;
  const w=10+random()*8;
  const d=10+random()*8;
  const h=12+random()*48;
  building(x,z,w,d,h,buildingIndex++);
 }
}

// TREES
function tree(x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);
 const trunk=mat(0x60442c);
 const leaves=[mat(0x315b39),mat(0x416d43),mat(0x557b48)];
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,3,7),trunk);
 t.position.y=1.5;t.castShadow=true;g.add(t);
 for(let i=0;i<4;i++){
  const crown=new THREE.Mesh(
   new THREE.SphereGeometry(1.35-i*.12,8,7),
   leaves[i%leaves.length]
  );
  crown.position.set((random()-.5)*.8,3.1+i*.4,(random()-.5)*.8);
  crown.castShadow=true;g.add(crown);
 }
}
for(let z=-100;z<=100;z+=17){
 tree(12,z);tree(-12,z);
}
for(let x=-100;x<=100;x+=17){
 tree(x,12);tree(x,-12);
}

// STREET LIGHTS
function streetLight(x,z){
 const poleMat=mat(0x333a3d,0.45,0.55);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,6,8),poleMat);
 pole.position.set(x,3,z);pole.castShadow=true;scene.add(pole);
 const arm=box(scene,1.4,.12,.12,poleMat,x+(x>0?-.6:.6),5.8,z);
 const lamp=new THREE.Mesh(
  new THREE.BoxGeometry(.55,.16,.35),
  new THREE.MeshStandardMaterial({color:0xfff0c5,emissive:0xffd58a,emissiveIntensity:.5})
 );
 lamp.position.set(x+(x>0?-1.1:1.1),5.65,z);scene.add(lamp);
}
for(let z=-100;z<=100;z+=35){
 streetLight(11.5,z);streetLight(-11.5,z);
}

// CAR MODEL
const car=new THREE.Group();
scene.add(car);
car.position.set(3,0,4);

const carPaint=new THREE.MeshStandardMaterial({
 color:0x1265a8,metalness:.75,roughness:.22
});
const body=box(car,2.15,.65,4.2,carPaint,0,.85,0);
const cabin=box(car,1.65,.85,2.1,glassMat,0,1.55,-.25);
box(car,1.72,.13,2.2,carPaint,0,2.0,-.25);

// Front and rear details
box(car,1.9,.17,.12,darkMat,0,.72,-2.12);
box(car,1.9,.17,.12,darkMat,0,.72,2.12);
const headMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xfff1cf,emissiveIntensity:1
});
box(car,.55,.18,.08,headMat,-.65,.95,-2.16);
box(car,.55,.18,.08,headMat,.65,.95,-2.16);
const tailMat=new THREE.MeshStandardMaterial({
 color:0xff1919,emissive:0xaa0000,emissiveIntensity:.7
});
box(car,.5,.2,.08,tailMat,-.65,.95,2.16);
box(car,.5,.2,.08,tailMat,.65,.95,2.16);

// Wheels
const wheels=[];
for(const x of [-1.12,1.12]){
 for(const z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.43,.25,20),
   darkMat
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.48,z);
  wheel.castShadow=true;car.add(wheel);wheels.push(wheel);

  const hub=new THREE.Mesh(
   new THREE.CylinderGeometry(.2,.2,.27,16),
   mat(0xb7bdc1,.3,.8)
  );
  hub.rotation.z=Math.PI/2;
  hub.position.copy(wheel.position);
  car.add(hub);
 }
}

// CHARACTER
const player=new THREE.Group();
scene.add(player);
player.position.set(-3,0,5);

const skin=mat(0xc88d68);
const shirt=mat(0x253d53);
const pants=mat(0x222a30);
const shoes=mat(0x171717);

const torso=box(player,.65,.9,.35,shirt,0,1.25,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),skin);
head.position.y=1.95;head.castShadow=true;player.add(head);
const legs=[];
for(const x of [-.19,.19]){
 const leg=box(player,.22,.65,.24,pants,x,.48,0);
 legs.push(leg);
 const foot=box(player,.25,.16,.4,shoes,x,.12,-.07);
}
const arms=[];
for(const x of [-.43,.43]){
 const arm=box(player,.18,.72,.2,skin,x,1.25,0);
 arms.push(arm);
}

let driving=false;
let speed=0;
let steering=0;
let moveForward=false,moveBack=false,turnLeft=false,turnRight=false;
let clock=new THREE.Clock();

function bindHold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();el.setPointerCapture(e.pointerId);callback(true);
 });
 el.addEventListener('pointerup',e=>{e.preventDefault();callback(false)});
 el.addEventListener('pointercancel',()=>callback(false));
 el.addEventListener('lostpointercapture',()=>callback(false));
}
bindHold('gas',v=>moveForward=v);
bindHold('brake',v=>moveBack=v);
bindHold('left',v=>turnLeft=v);
bindHold('right',v=>turnRight=v);

const status=document.getElementById('status');
const message=document.getElementById('message');
const enter=document.getElementById('enter');

function notify(text){
 message.textContent=text;
 message.style.display='block';
 clearTimeout(notify.timer);
 notify.timer=setTimeout(()=>message.style.display='none',2600);
}

enter.addEventListener('click',()=>{
 if(!driving){
  if(player.position.distanceTo(car.position)<5){
   driving=true;
   player.visible=false;
   enter.textContent='KELUAR MOBIL';
   status.textContent='MODE: MENGEMUDI';
   notify('Kamu masuk ke mobil');
  }else{
   notify('Dekati mobil terlebih dahulu');
  }
 }else{
  driving=false;
  player.visible=true;
  player.position.copy(car.position);
  player.position.x+=2.8;
  enter.textContent='MASUK MOBIL';
  status.textContent='MODE: BERJALAN';
  notify('Kamu keluar dari mobil');
 }
});

// CAMERA FOLLOW
const cameraTarget=new THREE.Vector3();
const desiredCamera=new THREE.Vector3();

function updateCamera(dt){
 const target=driving?car:player;
 const direction=new THREE.Vector3(
  Math.sin(target.rotation.y),0,Math.cos(target.rotation.y)
 );
 if(driving){
  desiredCamera.set(
   target.position.x-direction.x*9,
   target.position.y+5.5,
   target.position.z-direction.z*9
  );
 }else{
  desiredCamera.set(
   target.position.x-direction.x*7,
   target.position.y+4.2,
   target.position.z-direction.z*7
  );
 }
 camera.position.lerp(desiredCamera,1-Math.exp(-3*dt));
 cameraTarget.copy(target.position);
 cameraTarget.y+=driving?1.1:1.4;
 camera.lookAt(cameraTarget);
}

// SIMPLE PLAYER MOVEMENT AND DRIVING
function update(dt){
 const turn=(turnRight?1:0)-(turnLeft?1:0);
 if(driving){
  if(moveForward)speed=Math.min(speed+dt*8,24);
  else if(moveBack)speed=Math.max(speed-dt*15,-8);
  else speed*=Math.pow(.965,dt*60);

  car.rotation.y+=turn*dt*(1.5+Math.abs(speed)*.035)*(speed<0?-1:1);
  car.position.x+=Math.sin(car.rotation.y)*speed*dt;
  car.position.z+=Math.cos(car.rotation.y)*speed*dt;
  wheels.forEach(w=>w.rotation.x+=speed*dt*1.8);
 }else{
  const moving=moveForward||moveBack;
  if(moving){
   const dir=moveForward?1:-1;
   player.rotation.y+=turn*dt*2.5;
   player.position.x+=Math.sin(player.rotation.y)*dir*dt*5;
   player.position.z+=Math.cos(player.rotation.y)*dir*dt*5;
  }else{
   player.rotation.y+=turn*dt*1.5;
  }
 }
 // Keep player/car within the demo city area
 car.position.x=THREE.MathUtils.clamp(car.position.x,-140,140);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-140,140);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-140,140);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-140,140);
}

// SKY SUN
const sunBall=new THREE.Mesh(
 new THREE.SphereGeometry(7,20,16),
 new THREE.MeshBasicMaterial({color:0xffe4a5})
);
sunBall.position.set(-100,95,-180);
scene.add(sunBall);

// ANIMATION
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 updateCamera(dt);
 renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
});
</script>
</body>
</html>
